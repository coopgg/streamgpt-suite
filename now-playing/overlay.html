<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamGPT Now Playing</title>
<!--
  StreamGPT Now Playing overlay. Add as an OBS Browser Source, 1920 x 1080: the widget fills
  it (fit=1), so you can put it in its own scene and place and resize that scene anywhere.

  With Streamer.bot, the look is saved in Streamer.bot by editor.html and pushed here live, so
  the link never needs to change. Options in the link still work and are used until then.

  The idea: the album cover sets the overlay's colour. The card is the cover
  plus a flat field of the cover's own main colour, with the text in
  whichever ink (light or dark) reads best on it.

  URL options (all optional), e.g. overlay.html?theme=strip&align=right
    theme=field       field, strip, bare, poster, glow or vinyl
    corners=round     round or square
    color=auto        auto = the field takes the album art's colour, or a fixed hex like 15171c
    fit=1             1 = the widget fills the browser source (as large as fits, centred);
                      0 = fixed size in the top corner
    scale=1           fit=1: how much of the source it fills (0.3 to 1); fit=0: size multiplier
    align=left        fit=0 only: left or right
    in=rise           how it appears: rise, fade, slide, pop or none
    out=sink          how it disappears: sink, fade, slide, pop or none
    change=rise       on a new song: rise, fade, slide or none
    speed=normal      slow, normal or fast
    ads=hide          during Spotify ads: hide, or show (an "Ad break" card)
    sync=1            0 = ignore the look saved in Streamer.bot and use only this link
    hide=5            seconds after pausing before it hides, 0 = never hide
    popup=0           seconds to show after each new song then hide, 0 = always show while playing
    source=1          show the app name (Spotify, Chrome...), 0 to hide
    time=1            show elapsed and total time, 0 to hide (vinyl: off unless set)
    progress=1        show the progress bar, 0 to hide (vinyl: a ring around the record, off unless set)
    rpm=33            vinyl only: how fast the record turns (33, 45, or slower like 10)
    host=127.0.0.1    Streamer.bot WebSocket server address
    port=8080         Streamer.bot WebSocket server port
    endpoint=/        Streamer.bot WebSocket endpoint
    password=         only if you turned on WebSocket authentication
    demo=0            1 = sample songs, for positioning without Streamer.bot
    action=[Spotify] Now Playing   the Streamer.bot action's exact name, if you named it differently
    only=             SMTC Bridge mode: use only these apps, e.g. only=spotify
    bridge=           read from SMTC Bridge instead of Streamer.bot, e.g. bridge=1
                      (uses 127.0.0.1:5000) or bridge=192.168.1.20:5000. Overlay only:
                      !song and the Song Changed trigger need the Streamer.bot setup.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #15171c;
    --ink: #f6f6f8;
    --ink-2: rgba(246, 246, 248, 0.8);
    --track: rgba(246, 246, 248, 0.2);
    --accent: #ff5a5a;
    --scale: 1;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --display: "Oswald", "Arial Narrow", sans-serif;
    --text: "Inter", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; }
  body { font-family: var(--text); padding: 16px; -webkit-font-smoothing: antialiased; }
  .stage { display: flex; }
  .stage.right { justify-content: flex-end; }

  .np {
    position: relative; display: flex; width: 460px; zoom: var(--scale);
    background: var(--ground); color: var(--ink);
    opacity: 0;
    transition: background-color 0.6s ease, color 0.6s ease;
  }

  /* ---------- fit=1: the widget fills the browser source, centred ---------- */
  html.fit body { padding: 0; }
  html.fit .stage { position: fixed; inset: 0; align-items: center; justify-content: center; }

  /* ---------- appearing and disappearing (in=, out=, speed=) ----------
     The animation names are set on :root by configure(); --dir is 1 when the widget sits on the
     left (slides come from the left) and -1 on the right. */
  .np.show { opacity: 1; animation: var(--in-name, np-rise-in) calc(0.5s * var(--spd, 1)) var(--ease) both; }
  .np.leaving { opacity: 0; animation: var(--out-name, np-sink-out) calc(0.35s * var(--spd, 1)) cubic-bezier(0.5, 0, 0.75, 0) both; }
  @keyframes np-rise-in { from { opacity: 0; translate: 0 28px; } }
  @keyframes np-fade-in { from { opacity: 0; } }
  @keyframes np-slide-in { from { opacity: 0; translate: calc(-72px * var(--dir, 1)) 0; } }
  @keyframes np-pop-in { from { opacity: 0; scale: 0.82; } }
  @keyframes np-sink-out { from { opacity: 1; translate: 0 0; } to { opacity: 0; translate: 0 28px; } }
  @keyframes np-fade-out { from { opacity: 1; } to { opacity: 0; } }
  @keyframes np-slide-out { from { opacity: 1; translate: 0 0; } to { opacity: 0; translate: calc(-72px * var(--dir, 1)) 0; } }
  @keyframes np-pop-out { from { opacity: 1; scale: 1; } to { opacity: 0; scale: 0.82; } }

  .cover-wrap { flex: none; display: flex; position: relative; }
  .cover { width: 108px; aspect-ratio: 1; flex: none; background: center / cover no-repeat; }
  .np.no-art .cover-wrap { display: none; }

  .field {
    position: relative; flex: 1; min-width: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 14px 20px 18px;
  }
  .line { overflow: hidden; white-space: nowrap; }
  .line span { display: inline-block; }
  .line.scroll span { animation: marquee var(--dur, 10s) ease-in-out infinite; }
  @keyframes marquee { 0%, 18% { transform: translateX(0); } 82%, 100% { transform: translateX(var(--shift)); } }

  .title { font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1.08; letter-spacing: -0.01em; }
  .artist { font-size: 15px; font-weight: 500; line-height: 1.35; color: var(--ink-2); margin-top: 2px; }
  .info {
    display: flex; justify-content: space-between; gap: 12px; margin-top: 8px;
    font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink-2);
  }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--track); }
  .fill { height: 100%; width: 0; background: var(--accent); transition: background-color 0.6s ease, opacity 0.3s ease; }
  .np.paused .fill { opacity: 0.45; }

  .no-progress .bar { display: none; }
  .no-progress .field { padding-bottom: 14px; }
  .no-time .time, .no-source .src { display: none; }
  .no-time.no-source .info { display: none; }

  /* ---------- strip: one slim line ---------- */
  .t-strip .np { width: 520px; min-height: 50px; }
  .t-strip .cover { width: 50px; }
  .t-strip .field { flex-direction: row; align-items: baseline; justify-content: flex-start; gap: 12px; padding: 0 18px 3px; align-self: center; }
  .t-strip .title { font-size: 21px; flex: 0 1 auto; min-width: 0; }
  .t-strip .artist { font-size: 14px; flex: 1 1 0; min-width: 40px; margin: 0; }
  .t-strip .info { display: none; }
  .t-strip .field { position: static; }
  .t-strip .bar { height: 3px; left: 50px; }
  .t-strip .np.no-art .bar { left: 0; }

  /* ---------- bare: no field, text straight on the scene ---------- */
  .t-bare .np { background: transparent; width: 480px; --ink: #fff; --ink-2: rgba(255, 255, 255, 0.88); --track: rgba(0, 0, 0, 0.5); }
  .t-bare .cover { width: 84px; }
  .t-bare .field { padding: 0 0 0 16px; }
  /* With no field the text sits on live gameplay, so it gets a dark scrim; nothing else here has one. */
  .t-bare .field > :not(.bar) { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 0, 0, 0.55); } /* taste-skill-ignore */
  .t-bare .bar { position: static; margin-top: 10px; }

  /* ---------- poster: big cover, field underneath ---------- */
  .t-poster .np { flex-direction: column; width: 280px; }
  .t-poster .cover-wrap, .t-poster .cover { width: 100%; }
  .t-poster .field { padding: 16px 20px 22px; }
  .t-poster .title { font-size: 32px; }

  /* ---------- glow: the cover glows in its own colours ----------
     Opt-in, and the one theme outside the no-glow, no-blur house rules.
     The glow is a blurred, saturated copy of the cover itself (background: inherit),
     so it always matches the art with no colour picking. */
  .t-glow .np { background: transparent; width: 480px; padding: 22px; --ink: #fff; --ink-2: rgba(255, 255, 255, 0.88); --track: rgba(0, 0, 0, 0.5); }
  .t-glow .cover { position: relative; isolation: isolate; width: 96px; }
  .t-glow .cover::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: inherit;
    filter: blur(22px) saturate(1.8); /* taste-skill-ignore: this theme exists for the glow */
    scale: 1.25; opacity: 0.9;
  }
  /* A box's own background paints under its children, so a sharp copy of the cover goes on top of the glow. */
  .t-glow .cover::after { content: ""; position: absolute; inset: 0; background: inherit; }
  .t-glow .field { padding: 0 0 0 20px; }
  .t-glow .field > :not(.bar) { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 0, 0, 0.55); } /* taste-skill-ignore */
  .t-glow .bar { position: static; margin-top: 10px; }

  /* ---------- rounded corners (corners=square turns them off) ---------- */
  .stage { --r: 16px; --r-art: 10px; }
  .stage.square { --r: 0px; --r-art: 0px; }
  .t-field .np, .t-poster .np { border-radius: var(--r); overflow: hidden; }
  .t-field .cover-wrap { padding: 10px 0 10px 10px; }
  .t-field .cover { width: 96px; border-radius: var(--r-art); }
  .t-poster .cover-wrap { padding: 12px 12px 0; }
  .t-poster .cover { border-radius: var(--r-art); }
  .t-bare .cover, .t-glow .cover, .t-glow .cover::before, .t-glow .cover::after { border-radius: var(--r-art); }
  .t-bare .bar, .t-bare .fill, .t-glow .bar, .t-glow .fill, .t-strip .bar, .t-strip .fill { border-radius: 99px; }
  /* On a rounded card the bar sits inside, under the text, rather than along the clipped bottom edge. */
  .t-field .bar, .t-poster .bar { position: static; margin-top: 10px; }
  .t-field .bar, .t-field .fill, .t-poster .bar, .t-poster .fill { border-radius: 99px; }
  .t-field .field { padding-bottom: 14px; }
  .t-poster .field { padding-bottom: 18px; }
  .t-strip .np { border-radius: 999px; overflow: hidden; }
  .t-strip .cover-wrap { padding: 5px; }
  .t-strip .cover { width: 40px; border-radius: 50%; }
  .t-strip .bar { left: 60px; right: 24px; bottom: 5px; }
  .t-strip .np.no-art .bar { left: 24px; }
  .stage.square.t-strip .np, .stage.square.t-strip .cover { border-radius: 0; }

  /* ---------- vinyl: just the record, with the cover as its centre label ---------- */
  .t-vinyl .np { background: transparent; width: auto; padding: 8px; --disc: 220px; }
  .t-vinyl .field { display: none; }
  .t-vinyl .np.no-art .cover-wrap { display: flex; }
  .t-vinyl .cover-wrap {
    padding: 12px;
    /* The record floats over the game, so it gets a soft dark halo underneath to lift it off busy scenes. */
    filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.45)); /* taste-skill-ignore */
  }
  .t-vinyl .cover {
    position: relative; width: var(--disc); border-radius: 50%;
    /* The record itself, drawn in code: a shiny rim over the grooves, and a spindle hole you can see through. */
    background: radial-gradient(circle closest-side, transparent 95.5%, #4a4a52 97%, #1c1c20 100%), var(--grooves) !important; /* taste-skill-ignore */
    -webkit-mask: radial-gradient(circle closest-side, transparent 0 3.6%, #000 4.2%); /* taste-skill-ignore */
    mask: radial-gradient(circle closest-side, transparent 0 3.6%, #000 4.2%); /* taste-skill-ignore */
    animation: spin var(--spin, 1.8s) linear infinite;
  }
  /* Grooves: a few pixels apart on a small record; a share of the record when it fills the screen,
     so they stay fine when scaled up (pixel spacing turns into thick rings) and do not shimmer when small. */
  .t-vinyl { --grooves: repeating-radial-gradient(circle, #1d1d20 0 1px, #0b0b0c 1px 3px); } /* taste-skill-ignore */
  html.fit .t-vinyl { --grooves: repeating-radial-gradient(circle closest-side, #1d1d20 0 0.45%, #0b0b0c 0.45% 1.3%); } /* taste-skill-ignore */
  .t-vinyl .cover::before {
    content: ""; position: absolute; inset: 30%; border-radius: 50%;
    background: var(--accent) var(--art, none) center / cover no-repeat;
  }
  /* Light catching the grooves: it stays still while the record turns under it. */
  .t-vinyl .cover-wrap::after {
    content: ""; position: absolute; top: 12px; left: 12px; width: var(--disc); aspect-ratio: 1; border-radius: 50%; pointer-events: none;
    background: conic-gradient(from 20deg, transparent 0 8%, rgba(255, 255, 255, 0.14) 13%, transparent 19% 58%, rgba(255, 255, 255, 0.1) 63%, transparent 69%); /* taste-skill-ignore */
    -webkit-mask: radial-gradient(circle closest-side, transparent 0 31%, #000 31.5%); /* taste-skill-ignore */
    mask: radial-gradient(circle closest-side, transparent 0 31%, #000 31.5%); /* taste-skill-ignore */
  }
  /* Progress: a ring around the record that fills clockwise from the top. */
  .ring { display: none; position: absolute; inset: 0; width: 100%; height: 100%; rotate: -90deg; overflow: visible; pointer-events: none; }
  .ring circle { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; transition: stroke 0.6s ease; }
  .t-vinyl .np:not(.no-progress) .ring { display: block; }
  @keyframes spin { to { rotate: 360deg; } }

  /* ---------- new song (change=): the cover fades up and the text comes in, one line after another ---------- */
  @media (prefers-reduced-motion: no-preference) {
    .stage:not(.chg-none) .np.swap .cover { animation: fade calc(0.5s * var(--spd, 1)) ease both; }
    .stage.t-vinyl .np.swap .cover { animation: spin var(--spin, 1.8s) linear infinite; }
    .t-vinyl:not(.chg-none) .np.swap .cover::before { animation: fade calc(0.5s * var(--spd, 1)) ease both; }
    .chg-rise .np.swap .title { animation: rise calc(0.5s * var(--spd, 1)) var(--ease) both; }
    .chg-rise .np.swap .artist { animation: rise calc(0.5s * var(--spd, 1)) var(--ease) calc(0.07s * var(--spd, 1)) both; }
    .chg-rise .np.swap .info { animation: rise calc(0.5s * var(--spd, 1)) var(--ease) calc(0.14s * var(--spd, 1)) both; }
    .chg-slide .np.swap .title { animation: slide-x calc(0.5s * var(--spd, 1)) var(--ease) both; }
    .chg-slide .np.swap .artist { animation: slide-x calc(0.5s * var(--spd, 1)) var(--ease) calc(0.07s * var(--spd, 1)) both; }
    .chg-slide .np.swap .info { animation: slide-x calc(0.5s * var(--spd, 1)) var(--ease) calc(0.14s * var(--spd, 1)) both; }
    .chg-fade .np.swap .field > :not(.bar) { animation: fade calc(0.5s * var(--spd, 1)) ease both; }
  }
  @keyframes rise { from { opacity: 0; translate: 0 14px; } }
  @keyframes slide-x { from { opacity: 0; translate: calc(-24px * var(--dir, 1)) 0; } }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    /* Asked for less motion: everything only fades, nothing travels. */
    .np.show { animation-name: np-fade-in; }
    .np.leaving { animation-name: np-fade-out; }
    .t-vinyl .cover { animation: none; }
  }
  /* After the new-song rules, which restart the spin: a paused record stops where it is. */
  .stage.t-vinyl .np.paused .cover { animation-play-state: paused; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="np no-art" id="np" role="status" aria-live="polite">
    <div class="cover-wrap"><div class="cover" id="cover"></div><svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle id="ring" cx="50" cy="50" r="49" pathLength="100" stroke-dasharray="0 100"/></svg></div>
    <div class="field">
      <p class="line title" id="title"><span></span></p>
      <p class="line artist" id="artist"><span></span></p>
      <p class="info"><span class="time" id="time"></span><span class="src" id="src"></span></p>
      <div class="bar"><div class="fill" id="fill"></div></div>
    </div>
  </div>
</div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const aliases = { card: 'field', compact: 'strip', minimal: 'bare', spotlight: 'poster' };
  const THEMES = ['field', 'strip', 'bare', 'poster', 'glow', 'vinyl'];
  const pick = (v, list, dflt) => list.includes(v) ? v : dflt;
  // Display settings. Parsed by a function so the editor page can change them while the overlay runs.
  function readLook(p) {
    const t = aliases[p.get('theme')] || p.get('theme');
    const theme = THEMES.includes(t) ? t : 'field';
    const colorIn = (p.get('color') || p.get('accent') || 'auto').toLowerCase();
    const vinyl = theme === 'vinyl';
    const fit = p.get('fit') !== '0';
    return {
      theme,
      fit,
      color: colorIn === 'auto' ? 'auto' : colorIn.replace(/[^0-9a-f]/g, ''),
      align: p.get('align') === 'right' ? 'right' : 'left',
      scale: fit ? Math.min(1, Math.max(0.2, parseFloat(p.get('scale')) || 1)) : Math.min(4, Math.max(0.25, parseFloat(p.get('scale')) || 1)),
      in: pick(p.get('in'), ['rise', 'fade', 'slide', 'pop', 'none'], 'rise'),
      out: pick(p.get('out'), ['sink', 'fade', 'slide', 'pop', 'none'], 'sink'),
      change: pick(p.get('change'), ['rise', 'fade', 'slide', 'none'], 'rise'),
      speed: pick(p.get('speed'), ['slow', 'normal', 'fast'], 'normal'),
      ads: pick(p.get('ads'), ['hide', 'show'], 'hide'),
      hide: p.has('hide') ? Math.max(0, parseFloat(p.get('hide')) || 0) : 5,
      popup: Math.max(0, parseFloat(p.get('popup')) || 0),
      source: p.get('source') !== '0',
      time: p.has('time') ? p.get('time') !== '0' : !vinyl,
      progress: p.has('progress') ? p.get('progress') !== '0' : !vinyl,
      rpm: Math.min(78, Math.max(2, parseFloat(p.get('rpm')) || 33.33)),
      corners: p.get('corners') === 'square' ? 'square' : 'round'
    };
  }
  const opt = {
    ...readLook(q),
    host: q.get('host') || '127.0.0.1',
    port: q.get('port') || '8080',
    endpoint: q.get('endpoint') || '/',
    password: q.get('password') || '',
    demo: q.get('demo') === '1',
    preview: q.get('preview') === '1',
    sync: q.get('sync') !== '0',
    bridge: !q.has('bridge') || q.get('bridge') === '0' ? '' : (q.get('bridge') === '1' || q.get('bridge') === '' ? '127.0.0.1:5000' : q.get('bridge').replace(/^https?:\/\//, '').replace(/\/.*$/, '')),
    action: q.get('action') || '[Spotify] Now Playing',
    only: (q.get('only') || '').toLowerCase().split(',').map((x) => x.trim()).filter(Boolean)
  };

  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const np = $('np');
  const stage = $('stage');

  // ---------- colour: the field takes the cover's main colour ----------
  const hexToRgb = (h) => {
    if (h.length === 3) h = h.split('').map((c) => c + c).join('');
    if (h.length !== 6) return null;
    return [0, 2, 4].map((i) => parseInt(h.slice(i, i + 2), 16));
  };
  const DEFAULT_GROUND = [21, 23, 28];
  const DEFAULT_ACCENT = [255, 90, 90];
  let fixedGround = null;

  const lum = ([r, g, b]) => {
    const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
  };
  const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const sat = ([r, g, b]) => { const mx = Math.max(r, g, b), mn = Math.min(r, g, b); return mx === 0 ? 0 : (mx - mn) / mx; };
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  const css = (c, a) => a === undefined ? `rgb(${c.join(' ')})` : `rgb(${c.join(' ')} / ${a})`;

  // Pick ink (light or dark) for a ground, nudging the ground until the text reads clearly.
  function palette(ground, accent) {
    const WHITE = [246, 246, 248], BLACK = [17, 17, 20];
    const light = contrast(WHITE, ground) >= contrast(BLACK, ground);
    const ink = light ? WHITE : BLACK;
    let g = ground;
    for (let i = 0; i < 24 && contrast(ink, g) < 6; i++) g = mix(g, light ? [0, 0, 0] : [255, 255, 255], 0.07);
    let a = accent;
    if (a) for (let i = 0; i < 8 && contrast(a, g) < 2.4; i++) a = mix(a, light ? [255, 255, 255] : [0, 0, 0], 0.15);
    if (!a || contrast(a, g) < 2.4) a = ink;
    return { ground: g, ink, accent: a };
  }

  function applyPalette(p) {
    root.style.setProperty('--ground', css(p.ground));
    const onScene = opt.theme === 'bare' || opt.theme === 'glow' || opt.theme === 'vinyl';
    if (!onScene) {
      root.style.setProperty('--ink', css(p.ink));
      root.style.setProperty('--ink-2', css(p.ink, 0.8));
      root.style.setProperty('--track', css(p.ink, 0.2));
    }
    root.style.setProperty('--accent', css(onScene && p.vivid ? p.vivid : p.accent));
  }

  const coverCache = new Map();
  function readCover(src) {
    return new Promise((resolve) => {
      if (coverCache.has(src)) return resolve(coverCache.get(src));
      const img = new Image();
      img.onload = () => {
        try {
          const n = 48, c = document.createElement('canvas');
          c.width = c.height = n;
          const ctx = c.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(img, 0, 0, n, n);
          const px = ctx.getImageData(0, 0, n, n).data;
          const buckets = new Map();
          let total = 0;
          for (let i = 0; i < px.length; i += 4) {
            if (px[i + 3] < 128) continue;
            const key = (px[i] >> 5) * 64 + (px[i + 1] >> 5) * 8 + (px[i + 2] >> 5);
            const b = buckets.get(key) || { n: 0, r: 0, g: 0, b: 0 };
            b.n++; b.r += px[i]; b.g += px[i + 1]; b.b += px[i + 2];
            buckets.set(key, b);
            total++;
          }
          const list = [...buckets.values()].map((b) => ({ n: b.n, c: [b.r / b.n, b.g / b.n, b.b / b.n].map(Math.round) }));
          list.sort((x, y) => y.n - x.n);
          // The field colour: group the pixels into the cover's four main colours and take the biggest.
          // Grouping copes with soft gradients that would split across many small colour ranges.
          const pts = [];
          for (let i = 0; i < px.length; i += 4) if (px[i + 3] >= 128) pts.push([px[i], px[i + 1], px[i + 2]]);
          let ground = list[0] ? list[0].c : null;
          if (pts.length > 16) {
            const byLight = pts.slice().sort((x, y) => lum(x) - lum(y));
            let cents = [0.125, 0.375, 0.625, 0.875].map((f) => byLight[Math.floor(f * (byLight.length - 1))].slice());
            let groups = [];
            for (let it = 0; it < 10; it++) {
              groups = cents.map(() => ({ n: 0, s: [0, 0, 0] }));
              for (const c of pts) {
                let bi = 0, bd = Infinity;
                for (let k = 0; k < cents.length; k++) { const d = dist(c, cents[k]); if (d < bd) { bd = d; bi = k; } }
                const g = groups[bi]; g.n++; g.s[0] += c[0]; g.s[1] += c[1]; g.s[2] += c[2];
              }
              cents = groups.map((g, k) => g.n ? g.s.map((v) => Math.round(v / g.n)) : cents[k]);
            }
            let big = 0;
            groups.forEach((g, k) => { if (g.n > groups[big].n) big = k; });
            ground = cents[big];
          }
          let vivid = null, best = 0;
          for (const b of list) {
            if (b.n < total * 0.01) continue;
            const s = sat(b.c), score = b.n * s * s;
            if (s > 0.35 && Math.max(...b.c) > 70 && (!ground || dist(b.c, ground) > 90) && score > best) { best = score; vivid = b.c; }
          }
          const out = ground ? { ground, vivid } : null;
          coverCache.set(src, out);
          resolve(out);
        } catch (e) { resolve(null); }
      };
      img.onerror = () => resolve(null);
      img.src = src;
    });
  }

  function colourFor(art) {
    if (fixedGround) return applyPalette(palette(fixedGround, DEFAULT_ACCENT));
    if (!art) return applyPalette(palette(DEFAULT_GROUND, DEFAULT_ACCENT));
    readCover(art).then((r) => {
      if (!state || state.art !== art) return;
      if (!r) return applyPalette(palette(DEFAULT_GROUND, DEFAULT_ACCENT));
      const p = palette(r.ground, r.vivid);
      p.vivid = r.vivid || [255, 255, 255]; // bare and glow: white when the cover has no strong colour
      applyPalette(p);
    });
  }
  // ---------- rendering ----------
  let state = null, basePos = 0, baseAt = 0, trackKey = '', hideTimer = null, shownArt = null;

  // Covers from Streamer.bot arrive in parts after the song; they are put back together here and
  // attached to the song whose artId matches. The last few are kept so a resend needs no new parts.
  const covers = new Map(), coverParts = new Map(), askedFor = new Set();
  function takeCoverPart(m) {
    if (!m.artId || typeof m.data !== 'string' || !(m.parts > 0) || !(m.part >= 0) || m.part >= m.parts) return;
    let p = coverParts.get(m.artId);
    if (!p || p.length !== m.parts) { p = new Array(m.parts); coverParts.set(m.artId, p); }
    p[m.part] = m.data;
    for (let i = 0; i < p.length; i++) if (p[i] === undefined) return;
    coverParts.delete(m.artId);
    covers.set(m.artId, p.join(''));
    while (covers.size > 6) covers.delete(covers.keys().next().value);
    if (state && state.artId === m.artId && state.art !== covers.get(m.artId)) {
      const now = state.playing ? basePos + (performance.now() - baseAt) / 1000 : basePos;
      render(Object.assign({}, state, { art: covers.get(m.artId), position: now }));
    }
  }

  const fmt = (s) => {
    s = Math.max(0, Math.floor(s || 0));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = String(s % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
  };

  function setLine(el, text) {
    const span = el.firstElementChild;
    if (span.textContent === text) return;
    span.textContent = text;
    el.classList.remove('scroll');
    requestAnimationFrame(() => {
      const over = span.scrollWidth - el.clientWidth;
      if (over > 2) {
        el.style.setProperty('--shift', `-${over + 8}px`);
        el.style.setProperty('--dur', `${Math.max(8, over / 18 + 6)}s`);
        el.classList.add('scroll');
      }
    });
  }

  // Showing plays the in= animation; hiding swaps .show for .leaving, which plays the out= one.
  function show(on) {
    const shown = np.classList.contains('show');
    if (on && !shown) { np.classList.remove('leaving'); np.classList.add('show'); refit(); }
    else if (!on && shown) { np.classList.remove('show'); np.classList.add('leaving'); }
  }
  function scheduleHide(seconds) {
    clearTimeout(hideTimer);
    hideTimer = seconds > 0 ? setTimeout(() => show(false), seconds * 1000) : null;
  }
  function replaySwap() {
    np.classList.remove('swap');
    void np.offsetWidth;
    np.classList.add('swap');
  }

  function render(d) {
    if (!d || d.type !== 'nowplaying') return;
    // Spotify ads (free accounts): hide, or show a short card in place of the song.
    if (d.ad) {
      if (opt.ads === 'hide') {
        state = d; trackKey = 'ad'; basePos = 0; baseAt = performance.now();
        scheduleHide(0); show(false);
        return;
      }
      d = Object.assign({}, d, { title: 'Ad break', artist: 'Back to the music in a moment', album: '', art: null, artId: '', appId: 'ad' });
    }
    const wasPlaying = !!(state && state.playing);
    state = d;
    basePos = d.position || 0;
    baseAt = performance.now();

    const hasSong = !!d.title;
    const key = `${d.title}|${d.artist}|${d.appId}`;
    const newTrack = key !== trackKey;
    trackKey = key;

    if (hasSong) {
      if (newTrack && np.classList.contains('show')) replaySwap();
      setLine($('title'), d.title);
      setLine($('artist'), d.artist || d.album || '');
      $('src').textContent = d.source || '';
      if (d.art) {
        if (d.art !== shownArt) {
          shownArt = d.art;
          $('cover').style.backgroundImage = `url("${d.art}")`;
          np.style.setProperty('--art', `url("${d.art}")`);
          np.classList.remove('no-art');
          colourFor(d.art);
        }
      } else if (newTrack) {
        shownArt = null;
        $('cover').style.backgroundImage = '';
        np.style.setProperty('--art', 'none');
        np.classList.add('no-art');
        colourFor(null);
      }
    }
    np.classList.toggle('paused', !d.playing);
    tick();

    refit();
    if (!hasSong || d.status === 'None' || d.status === 'Closed') { scheduleHide(0); show(false); return; }

    if (d.playing) {
      if (opt.popup > 0) {
        if (newTrack || (!np.classList.contains('show') && !wasPlaying)) { show(true); scheduleHide(opt.popup); }
      } else { show(true); scheduleHide(0); }
    } else if (opt.hide > 0) {
      if (np.classList.contains('show') && (wasPlaying || newTrack)) scheduleHide(opt.hide);
    } else if (opt.popup === 0) {
      show(true); scheduleHide(0);
    }
  }

  function tick() {
    if (!state) return;
    let pos = basePos;
    if (state.playing) pos += (performance.now() - baseAt) / 1000;
    const dur = state.duration || 0;
    if (dur > 0) pos = Math.min(pos, dur);
    $('time').textContent = !state.playing ? 'Paused' : dur > 0 ? `${fmt(pos)} / ${fmt(dur)}` : fmt(pos);
    const pct = dur > 0 ? (pos / dur) * 100 : 0;
    $('fill').style.width = pct + '%';
    $('ring').setAttribute('stroke-dasharray', `${pct.toFixed(2)} 100`);
  }
  setInterval(tick, 250);

  // fit=1: scale the widget to fill the browser source (keeping its shape), centred, with a
  // margin so glows, rings and shadows are not cut off. Measured at zoom 1 so the result is exact.
  function refit() {
    if (!opt.fit) { root.style.setProperty('--scale', opt.scale); return; }
    root.style.setProperty('--scale', 1);
    const w = np.offsetWidth, h = np.offsetHeight;
    if (!w || !h) return;
    const k = Math.min(innerWidth * 0.9 / w, innerHeight * 0.9 / h) * opt.scale;
    root.style.setProperty('--scale', Math.max(0.1, k).toFixed(4));
  }
  addEventListener('resize', refit);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);

  const IN_NAMES = { rise: 'np-rise-in', fade: 'np-fade-in', slide: 'np-slide-in', pop: 'np-pop-in', none: 'none' };
  const OUT_NAMES = { sink: 'np-sink-out', fade: 'np-fade-out', slide: 'np-slide-out', pop: 'np-pop-out', none: 'none' };
  const SPEEDS = { slow: 1.6, normal: 1, fast: 0.6 };

  function configure(look) {
    Object.assign(opt, look);
    stage.className = 'stage t-' + opt.theme + ' chg-' + opt.change + (!opt.fit && opt.align === 'right' ? ' right' : '') + (opt.corners === 'square' ? ' square' : '');
    root.classList.toggle('fit', opt.fit);
    root.style.setProperty('--in-name', IN_NAMES[opt.in]);
    root.style.setProperty('--out-name', OUT_NAMES[opt.out]);
    root.style.setProperty('--spd', SPEEDS[opt.speed]);
    root.style.setProperty('--dir', !opt.fit && opt.align === 'right' ? -1 : 1);
    root.style.setProperty('--spin', (60 / opt.rpm).toFixed(3) + 's');
    np.classList.toggle('no-source', !opt.source);
    np.classList.toggle('no-time', !opt.time);
    np.classList.toggle('no-progress', !opt.progress);
    fixedGround = opt.color === 'auto' ? null : hexToRgb(opt.color);
    colourFor(shownArt);
    // A change of ad setting matters right away if an ad is on now.
    if (state && state.ad) render(Object.assign({}, state));
    refit();
  }

  // Hide, then show again, so the in= and out= animations can be watched (the editor's "Play it").
  function replay() {
    if (!np.classList.contains('show')) { show(true); return; }
    show(false);
    setTimeout(() => show(true), 350 * SPEEDS[opt.speed] + 500);
  }
  configure({});

  // The editor page (editor.html) sends new settings, and in preview mode its sample songs.
  window.addEventListener('message', (e) => {
    if (window.parent === window || e.source !== window.parent || !e.data || typeof e.data !== 'object') return;
    if (e.data.np === 'look') configure(readLook(new URLSearchParams(e.data.params || '')));
    else if (e.data.np === 'song' && opt.preview) render(Object.assign({ type: 'nowplaying' }, e.data.song));
    else if (e.data.np === 'replay') replay();
  });
  if (window.parent !== window) window.parent.postMessage({ np: 'ready' }, '*');
  if (opt.preview) return;

  // ---------- demo mode: sample songs with flat drawn covers ----------
  if (opt.demo) {
    const svg = (body) => 'data:image/svg+xml;base64,' + btoa(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${body}</svg>`);
    const songs = [
      { title: 'Harbour Lights', artist: 'The Tidewater Band', album: 'Low Water', source: 'Spotify', duration: 214,
        art: svg('<rect width="100" height="100" fill="#1d2a44"/><circle cx="64" cy="40" r="22" fill="#f2c230"/><rect y="70" width="100" height="30" fill="#2e4a6e"/>') },
      { title: 'A Much Longer Song Title That Has To Scroll Across', artist: 'The Overflow Collective featuring Somebody Else', album: '', source: 'Chrome', duration: 3725,
        art: svg('<rect width="100" height="100" fill="#1f4d3a"/><rect x="14" y="20" width="14" height="60" fill="#e8743b"/><rect x="36" y="34" width="14" height="46" fill="#e8743b"/><rect x="58" y="12" width="14" height="68" fill="#f4e3c8"/>') },
      { title: 'Red Line Home', artist: 'Kite Season', album: 'Updraft', source: 'Apple Music', duration: 187,
        art: svg('<rect width="100" height="100" fill="#c8362d"/><circle cx="50" cy="50" r="30" fill="#111"/><circle cx="50" cy="50" r="5" fill="#c8362d"/>') },
      { title: 'No Cover Art', artist: 'A song from an app that shares none', album: '', source: 'foobar2000', duration: 241, art: null }
    ];
    let i = q.has('song') ? parseInt(q.get('song'), 10) || 0 : 0;
    const next = () => {
      const s = songs[i++ % songs.length];
      render({ type: 'nowplaying', playing: true, status: 'Playing', appId: s.source, position: 48, ...s });
    };
    next();
    if (!q.has('song')) setInterval(next, 9000);
    return;
  }

  // ---------- SMTC Bridge (optional, instead of Streamer.bot) ----------
  if (opt.bridge) {
    const names = [['spotify', 'Spotify'], ['applemusic', 'Apple Music'], ['itunes', 'iTunes'], ['youtube-music', 'YouTube Music'],
      ['youtubemusic', 'YouTube Music'], ['tidal', 'TIDAL'], ['deezer', 'Deezer'], ['amazon', 'Amazon Music'], ['cider', 'Cider'],
      ['plexamp', 'Plexamp'], ['foobar', 'foobar2000'], ['musicbee', 'MusicBee'], ['winamp', 'Winamp'], ['aimp', 'AIMP'], ['vlc', 'VLC'],
      ['zunemusic', 'Media Player'], ['soundcloud', 'SoundCloud'], ['msedge', 'Edge'], ['chrome', 'Chrome'], ['firefox', 'Firefox'],
      ['308046b0af4a39cb', 'Firefox'], ['brave', 'Brave'], ['opera', 'Opera'], ['vivaldi', 'Vivaldi']];
    const sourceName = (id) => {
      const l = (id || '').toLowerCase();
      const hit = names.find(([k]) => l.includes(k));
      if (hit) return hit[1];
      return (id || '').split('!')[0].replace(/\.exe$/i, '').split('_')[0].split('.').pop();
    };
    const STATUS = ['Closed', 'Opened', 'Changing', 'Stopped', 'Playing', 'Paused'];
    let lastApp = null, emptySent = false;

    const toState = (data) => {
      const list = ((data && data.sessions) || []).filter((x) => !opt.only.length || opt.only.some((o) => String(x.source_app_id || '').toLowerCase().includes(o)));
      const playing = list.filter((x) => x.playback_info && x.playback_info.PlaybackStatus === 4);
      const s = playing.find((x) => x.source_app_id === lastApp) || playing[0]
        || list.find((x) => x.source_app_id === data.current_session_id)
        || list.find((x) => x.source_app_id === lastApp) || list[0];
      if (!s) return null;
      lastApp = s.source_app_id;
      const m = s.media_properties || {}, pb = s.playback_info || {}, tl = s.timeline_properties || {};
      const isPlaying = pb.PlaybackStatus === 4;
      const duration = Math.max(0, ((tl.EndTime || 0) - (tl.StartTime || 0)) / 1000);
      let position = (tl.Position || 0) / 1000;
      const updated = tl.LastUpdatedTime ? Date.parse(String(tl.LastUpdatedTime).replace(' ', 'T').replace(/(\.\d{3})\d+/, '$1')) : NaN;
      if (isPlaying && !isNaN(updated) && updated > 946684800000) position += Math.max(0, (Date.now() - updated) / 1000);
      if (duration > 0) position = Math.min(position, duration);
      const artist = m.Artist && m.Artist !== 'Unknown' ? m.Artist : (m.AlbumArtist && m.AlbumArtist !== 'Unknown' ? m.AlbumArtist : '');
      return {
        type: 'nowplaying', playing: isPlaying, status: STATUS[pb.PlaybackStatus] || 'Unknown',
        title: m.Title || '', artist, album: m.AlbumTitle || '', source: sourceName(s.source_app_id), appId: s.source_app_id,
        position, duration, art: m.Thumbnail || null
      };
    };

    const poll = async () => {
      try {
        const res = await fetch(`http://${opt.bridge}/now-playing`, { cache: 'no-store' });
        const st = toState(await res.json());
        if (st) { emptySent = false; render(st); }
        else if (!emptySent) { emptySent = true; render({ type: 'nowplaying', playing: false, status: 'None', title: '' }); }
      } catch (e) { /* SMTC Bridge not running yet; keep trying */ }
      setTimeout(poll, 1000);
    };
    poll();
    return;
  }

  // ---------- Streamer.bot WebSocket ----------
  let ws = null, ready = false, retry = 1000;
  const send = (obj) => { try { ws.send(JSON.stringify(obj)); } catch (e) {} };

  async function sha256b64(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return btoa(String.fromCharCode(...new Uint8Array(buf)));
  }

  function begin() {
    if (ready) return;
    ready = true;
    send({ request: 'Subscribe', id: 'np-sub', events: { General: ['Custom'] } });
    send({ request: 'DoAction', id: 'np-resend', action: { name: opt.action }, args: { npMode: 'resend' } });
  }

  function connect() {
    ready = false;
    try { ws = new WebSocket(`ws://${opt.host}:${opt.port}${opt.endpoint}`); }
    catch (e) { setTimeout(connect, retry); return; }

    let helloTimer = null;
    ws.onopen = () => {
      retry = 1000;
      helloTimer = setTimeout(begin, 1500); // older Streamer.bot versions do not send Hello
    };
    ws.onmessage = async (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }

      if (msg.request === 'Hello') {
        clearTimeout(helloTimer);
        const auth = msg.authentication;
        if (auth && auth.challenge) {
          if (!opt.password) { console.warn('Streamer.bot wants a password: add &password=... to the URL'); return; }
          try {
            const secret = await sha256b64(opt.password + auth.salt);
            const answer = await sha256b64(secret + auth.challenge);
            send({ request: 'Authenticate', id: 'np-auth', authentication: answer });
          } catch (e) { console.warn('Could not authenticate', e); }
        } else begin();
        return;
      }
      if (msg.id === 'np-auth') {
        if (msg.status === 'ok') begin(); else console.warn('Streamer.bot rejected the password');
        return;
      }

      let data = null;
      if (msg.event && msg.event.source === 'General' && msg.event.type === 'Custom') data = msg.data;
      else if (msg.type === 'nowplaying') data = msg;
      if (data && typeof data === 'string') { try { data = JSON.parse(data); } catch (e) { data = null; } }
      if (data && data.type === 'nowplaying') {
        // The cover comes separately, in parts (it is too big for one Streamer.bot message).
        if (!data.art && data.artId) data.art = covers.get(data.artId) || null;
        render(data);
        // A song whose cover never came (this overlay loaded mid-song, or a part went missing):
        // ask once more after a moment.
        if (data.artId && !covers.has(data.artId) && !askedFor.has(data.artId)) {
          const id = data.artId;
          askedFor.add(id);
          setTimeout(() => {
            if (!covers.has(id) && state && state.artId === id) {
              send({ request: 'DoAction', id: 'np-cover', action: { name: opt.action }, args: { npMode: 'resend' } });
            }
          }, 1500);
        }
      } else if (data && data.type === 'nowplaying-art') {
        takeCoverPart(data);
      } else if (data && data.type === 'nowplaying-look' && opt.sync && typeof data.params === 'string') {
        // The look saved in Streamer.bot by the editor: applied live, so the OBS link never changes.
        configure(readLook(new URLSearchParams(data.params)));
      } else if (data && data.type === 'nowplaying-replay') {
        replay();
      }
    };
    ws.onclose = () => {
      clearTimeout(helloTimer);
      setTimeout(connect, retry);
      retry = Math.min(retry * 2, 10000);
    };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }
  connect();
})();
</script>
</body>
</html>
